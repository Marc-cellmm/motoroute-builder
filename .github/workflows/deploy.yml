name: Publica la web

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *' # refresca els preus de la benzina
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Preus de carburant (MITECO)
        env:
          FALLBACK_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/fuel.json
        run: python3 scripts/fetch-fuel.py public/data/fuel.json

      - name: Build
        env:
          VITE_VALHALLA_URL: https://valhalla1.openstreetmap.de/route
          VITE_FUEL_URL: data/fuel.json
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
