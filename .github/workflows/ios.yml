name: Compila l'app iOS

# En un Mac de GitHub: compila l'app d'iPhone, comprova que el zip s'obre i compila sense
# Node.js, i el publica a Releases (ios-latest) per descarregar-lo i obrir-lo amb Xcode.
on:
  push:
    branches: [main]
    paths: ['ios/**', 'src/**', 'package.json', 'package-lock.json', 'capacitor.config.ts', 'scripts/package-ios.sh', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Web + sincronització amb iOS
        run: npm run build:ios

      - name: Empaqueta el zip per a Xcode
        run: ./scripts/package-ios.sh MotoRoute-iPhone.zip

      - name: Compila des del zip (sense Node), com ho farà l'usuari
        run: |
          set -o pipefail
          mkdir -p /tmp/check && unzip -q MotoRoute-iPhone.zip -d /tmp/check
          xcodebuild -project /tmp/check/MotoRoute-iPhone/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Publica a Releases (ios-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest MotoRoute-iPhone.zip \
            --title "MotoRoute per a iPhone (última versió)" \
            --notes "Descarrega MotoRoute-iPhone.zip, descomprimeix-lo i obre ios/App/App.xcodeproj amb Xcode. Instruccions a LLEGEIX-ME.txt." \
            --latest
